<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fusion Ad</title>
    <style>
      :root {
        --bg-top: #102334;
        --bg-bottom: #edf3f8;
        --card: #ffffff;
        --text: #10203a;
        --muted: #5f6f85;
        --pill: rgba(255, 255, 255, 0.18);
        --accent: #1f8bff;
        --accent-2: #12c6a7;
        --line: rgba(16, 32, 58, 0.08);
        --soft-bg: #f6f9fd;
        --shadow: 0 18px 46px rgba(5, 19, 33, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: var(--text);
        font-family: "Avenir Next", "Segoe UI", "SF Pro Display", sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
      }

      .page {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        overflow: hidden;
        background: linear-gradient(180deg, #ffffff 0%, var(--soft-bg) 100%);
      }

      .hero-shell {
        position: relative;
        flex: 1 1 auto;
        min-height: min(360px, 52vh);
        padding: max(18px, env(safe-area-inset-top)) 18px 0;
        overflow: hidden;
        background: #102334;
      }

      .hero-media {
        position: absolute;
        inset: 0;
        height: 100%;
        border-radius: 0;
        background:
          linear-gradient(180deg, rgba(7, 18, 31, 0.1) 0%, rgba(7, 18, 31, 0.05) 46%, rgba(7, 18, 31, 0.48) 100%),
          linear-gradient(135deg, #315efb 0%, #17c6ab 100%);
        background-size: cover;
        background-position: center;
        cursor: pointer;
      }

      .hero-frame {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        opacity: 0;
        transition: opacity 220ms ease;
      }

      .hero-frame.visible {
        opacity: 1;
      }

      .hero-click-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        cursor: pointer;
      }

      .hero-sound-btn {
        position: absolute;
        right: 18px;
        bottom: 16px;
        z-index: 4;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 999px;
        background: rgba(5, 16, 29, 0.42);
        color: #fff;
        cursor: pointer;
        backdrop-filter: blur(16px);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.16),
          0 10px 24px rgba(5, 16, 29, 0.18);
        -webkit-tap-highlight-color: transparent;
      }

      .hero-sound-btn svg {
        width: 23px;
        height: 23px;
        fill: currentColor;
      }

      .hero-sound-btn .sound-on,
      .hero-sound-btn.is-muted .sound-off {
        display: block;
      }

      .hero-sound-btn .sound-off,
      .hero-sound-btn.is-muted .sound-on {
        display: none;
      }

      .hero-shell.has-audio .hero-meta {
        right: 74px;
      }

      .hero-gloss {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.34), transparent 24%),
          radial-gradient(circle at 88% 12%, rgba(255, 255, 255, 0.18), transparent 22%);
        pointer-events: none;
      }

      .top-row {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .ad-mark {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        backdrop-filter: blur(14px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .ad-mark-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #39dd8f;
        box-shadow: 0 0 0 4px rgba(57, 221, 143, 0.15);
      }

      .close-btn {
        appearance: none;
        border: 0;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: rgba(9, 20, 34, 0.28);
        color: #fff;
        font-size: 23px;
        line-height: 1;
        backdrop-filter: blur(16px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
      }

      .hero-meta {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 16px;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .hero-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        background: rgba(5, 16, 29, 0.28);
        backdrop-filter: blur(16px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .card {
        position: relative;
        z-index: 3;
        flex: 0 0 auto;
        margin: 0;
        padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
        border-radius: 0;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        border-top: 1px solid rgba(16, 32, 58, 0.06);
        box-shadow: none;
        min-height: 0;
      }

      .app-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .app-icon {
        width: 60px;
        height: 60px;
        border-radius: 15px;
        background:
          linear-gradient(135deg, rgba(49, 94, 251, 0.16), rgba(18, 198, 167, 0.18)),
          #dfe7f4;
        background-size: cover;
        background-position: center;
        flex: 0 0 auto;
        box-shadow:
          0 10px 24px rgba(15, 38, 72, 0.14),
          inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      }

      .app-meta {
        min-width: 0;
        flex: 1;
      }

      .app-title {
        margin: 0;
        font-size: 22px;
        line-height: 1.06;
        letter-spacing: -0.03em;
        font-weight: 800;
      }

      .app-subtitle {
        display: -webkit-box;
        margin: 6px 0 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.38;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .metric-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 7px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .metric-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 999px;
        background: rgba(238, 244, 251, 0.92);
      }

      .stars {
        color: #ffb444;
        letter-spacing: 0.08em;
      }

      .actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 9px;
        margin-top: 13px;
      }

      .actions.single {
        grid-template-columns: minmax(0, 1fr);
      }

      .primary-btn,
      .secondary-btn,
      .recommend-card button {
        appearance: none;
        border: 0;
        border-radius: 20px;
        font-family: inherit;
        cursor: pointer;
      }

      .primary-btn {
        min-height: 52px;
        padding: 14px 18px;
        background: linear-gradient(135deg, #1478ff 0%, #26b9ff 100%);
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.01em;
        box-shadow: 0 14px 26px rgba(31, 139, 255, 0.28);
      }

      .secondary-btn {
        min-height: 52px;
        padding: 14px 18px;
        background: #ebf3fb;
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
      }

      .proof-strip {
        margin-top: 15px;
        padding: 13px 14px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(31, 139, 255, 0.08), rgba(18, 198, 167, 0.08));
        color: var(--text);
      }

      .proof-strip .label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #5a7897;
        margin-bottom: 6px;
      }

      .features {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 13px;
      }

      .feature-pill {
        padding: 10px 12px;
        border-radius: 16px;
        background: #f3f7fb;
        color: var(--text);
        font-size: 13px;
      }

      @media (max-height: 700px) {
        .hero-shell {
          min-height: min(300px, 48vh);
        }

        .card {
          padding-top: 14px;
        }

        .app-icon {
          width: 56px;
          height: 56px;
          border-radius: 14px;
        }

        .app-title {
          font-size: 21px;
        }

        .app-subtitle {
          font-size: 13px;
        }

        .metric-row {
          margin-top: 7px;
        }

        .actions {
          margin-top: 12px;
        }
      }

      @media (min-height: 820px) {
        .actions {
          margin-top: 14px;
        }
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(7, 18, 31, 0.38);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
        z-index: 7;
      }

      .drawer-backdrop.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .drawer {
        position: fixed;
        inset: auto 0 0;
        z-index: 8;
        padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
        border-radius: 26px 26px 0 0;
        background: rgba(250, 252, 255, 0.98);
        box-shadow: 0 -16px 40px rgba(7, 18, 31, 0.18);
        transform: translateY(105%);
        transition: transform 220ms ease;
      }

      .drawer.visible {
        transform: translateY(0);
      }

      .drawer-handle {
        width: 56px;
        height: 5px;
        border-radius: 999px;
        background: rgba(16, 32, 58, 0.14);
        margin: 0 auto 14px;
      }

      .drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .drawer-head h2 {
        margin: 0;
        font-size: 23px;
        letter-spacing: -0.03em;
      }

      .drawer-head p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .drawer-close {
        appearance: none;
        border: 0;
        width: 38px;
        height: 38px;
        border-radius: 999px;
        background: #e9f0f8;
        color: var(--text);
        font-size: 18px;
      }

      .recommend-list {
        display: grid;
        gap: 12px;
        margin-top: 16px;
        max-height: min(54vh, 460px);
        overflow-y: auto;
        padding-right: 2px;
      }

      .recommend-card {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid var(--line);
      }

      .recommend-thumb {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        background:
          linear-gradient(135deg, rgba(49, 94, 251, 0.16), rgba(18, 198, 167, 0.18)),
          #dfe7f4;
        background-size: cover;
        background-position: center;
      }

      .recommend-meta {
        min-width: 0;
      }

      .recommend-title {
        margin: 0;
        font-size: 16px;
        line-height: 1.15;
      }

      .recommend-desc {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .recommend-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }

      .recommend-card button {
        padding: 10px 14px;
        background: linear-gradient(135deg, #102e5f 0%, #15448a 100%);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <section class="hero-shell" id="heroShell">
        <div class="hero-media" id="heroMedia" role="button" tabindex="0">
          <iframe
            class="hero-frame hidden"
            id="heroFrame"
            title="Ad preview"
            loading="eager"
            allow="autoplay; fullscreen; encrypted-media"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
          ></iframe>
          <div class="hero-click-layer" id="heroClickLayer" data-fusion-primary></div>
        </div>
        <button class="hero-sound-btn is-muted hidden" id="soundBtn" type="button" aria-label="Sound off">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>
          </svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.5-2.5-1.4-1.4-2.5 2.5-2.5-2.5-1.4 1.4 2.5 2.5-2.5 2.5 1.4 1.4 2.5-2.5 2.5 2.5 1.4-1.4-2.5-2.5z"/>
          </svg>
        </button>
        <div class="hero-gloss"></div>
        <div class="top-row">
          <div class="ad-mark">
            <span class="ad-mark-dot"></span>
            <span id="adLabel">Sponsored</span>
          </div>
          <button class="close-btn" id="closeBtn" aria-label="Close ad">×</button>
        </div>
        <div class="hero-meta">
          <div class="hero-pill" id="heroBadge">Editor's pick</div>
          <div class="hero-pill" id="heroCategoryPill">Utilities</div>
          <div class="hero-pill" id="heroRatingPill">4.9 ★</div>
        </div>
      </section>

      <section class="card">
        <div class="app-row">
          <div class="app-icon" id="appIcon"></div>
          <div class="app-meta">
            <h2 class="app-title" id="appTitle">App title</h2>
            <p class="app-subtitle" id="appSubtitle">App description</p>
            <div class="metric-row">
              <div class="metric-chip">
                <span class="stars" id="appStars">★★★★★</span>
                <span id="appRating">4.9</span>
              </div>
              <div class="metric-chip" id="appCategory">Utilities</div>
              <div class="metric-chip" id="appReviewCount">120K reviews</div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="primary-btn" id="primaryCta">Install now</button>
          <button class="secondary-btn" id="secondaryCta">View more</button>
        </div>

        <div class="proof-strip">
          <span class="label">Why people install</span>
          <strong id="proofText">Fast onboarding, polished visuals, and a clear value proposition.</strong>
        </div>

        <div class="features" id="featureList"></div>
      </section>

      <div class="drawer-backdrop" id="drawerBackdrop"></div>
      <aside class="drawer" id="drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-head">
          <div>
            <h2 id="drawerTitle">More apps you may like</h2>
            <p id="drawerSubtitle">Handpicked recommendations</p>
          </div>
          <button class="drawer-close" id="drawerClose" aria-label="Close list">×</button>
        </div>
        <div class="recommend-list" id="recommendList"></div>
      </aside>
    </div>

    <script>
      __FUSION_AD_BOOTSTRAP__

      (function () {
        var payload = window.FusionAdPayload || {};
        var primary = payload.primary || {};
        var list = payload.list || {};
        var heroMuted = true;
        var heroHtmlEnabled = false;
        var heroAudioSupported = true;

        function byId(id) {
          return document.getElementById(id);
        }

        function setText(id, value, fallback) {
          var node = byId(id);
          if (!node) return;
          var finalValue = value || fallback || "";
          node.textContent = finalValue;
        }

        function setBackgroundImage(id, url) {
          var node = byId(id);
          if (!node || !url) return;
          node.style.backgroundImage = "linear-gradient(180deg, rgba(7, 18, 31, 0.1) 0%, rgba(7, 18, 31, 0.05) 46%, rgba(7, 18, 31, 0.48) 100%), url('" + url.replace(/'/g, "%27") + "')";
        }

        function setCardImage(id, url) {
          var node = byId(id);
          if (!node || !url) return;
          node.style.backgroundImage = "url('" + url.replace(/'/g, "%27") + "')";
        }

        function looksLikeHtmlMedia(url) {
          if (!url) return false;
          try {
            var parsed = new URL(String(url), window.location.href);
            return /\.html?$/i.test(parsed.pathname || "");
          } catch (ignore) {
            return /\.html?(\?|#|$)/i.test(String(url));
          }
        }

        function updateSoundButton() {
          var button = byId("soundBtn");
          if (!button) return;
          button.classList.toggle("hidden", !heroHtmlEnabled || !heroAudioSupported);
          button.classList.toggle("is-muted", heroMuted);
          button.setAttribute("aria-label", heroMuted ? "Turn sound on" : "Turn sound off");
          button.setAttribute("title", heroMuted ? "Turn sound on" : "Turn sound off");
        }

        function setHeroAudioSupported(supported) {
          heroAudioSupported = !!supported;
          var shell = byId("heroShell");
          if (shell) {
            shell.classList.toggle("has-audio", heroHtmlEnabled && heroAudioSupported);
          }
          if (!heroAudioSupported) {
            heroMuted = true;
          }
          updateSoundButton();
        }

        function postHeroMuteState() {
          var frame = byId("heroFrame");
          if (!frame || !frame.contentWindow || !heroHtmlEnabled) return;
          var message = {
            type: "fusion_ad_mute_changed",
            muted: !!heroMuted,
            source: "fusionadsdk"
          };
          var legacyMessage = {
            type: "fusion_ad_audio",
            action: "mute_changed",
            muted: !!heroMuted,
            source: "fusionadsdk"
          };
          try {
            frame.contentWindow.postMessage(message, "*");
            frame.contentWindow.postMessage(legacyMessage, "*");
          } catch (ignore) {}
        }

        function setHeroMuted(muted, shouldNotifyFrame) {
          heroMuted = !!muted;
          updateSoundButton();
          if (shouldNotifyFrame) {
            postHeroMuteState();
          }
        }

        function setHeroMedia(primary) {
          var shell = byId("heroShell");
          var hero = byId("heroMedia");
          var frame = byId("heroFrame");
          if (!hero) return;

          var imageUrl = primary.heroImageUrl || "";
          var htmlUrl = primary.heroHtmlUrl || "";
          if (!htmlUrl && looksLikeHtmlMedia(imageUrl)) {
            htmlUrl = imageUrl;
            imageUrl = "";
          }

          if (imageUrl) {
            setBackgroundImage("heroMedia", imageUrl);
          }

          if (htmlUrl && frame) {
            heroHtmlEnabled = true;
            setHeroAudioSupported(true);
            setHeroMuted(true, false);
            hero.classList.add("has-html");
            frame.classList.remove("hidden");
            frame.addEventListener("load", function () {
              frame.classList.add("visible");
              postHeroMuteState();
            });
            frame.src = htmlUrl;
          } else if (frame) {
            heroHtmlEnabled = false;
            setHeroAudioSupported(false);
            frame.removeAttribute("src");
            frame.classList.add("hidden");
            frame.classList.remove("visible");
          }
        }

        function buildStars(rating) {
          var numeric = Number(rating || 0);
          if (!numeric) return "★★★★★";
          var full = Math.max(0, Math.min(5, Math.round(numeric)));
          var stars = "";
          for (var i = 0; i < 5; i++) {
            stars += i < full ? "★" : "☆";
          }
          return stars;
        }

        function navigateBridge(action, params) {
          if (window.FusionAdBridge) {
            if (action === "click" && window.FusionAdBridge.click) {
              window.FusionAdBridge.click(
                params && params.target ? String(params.target) : "",
                params && params.packageName ? String(params.packageName) : ""
              );
              return;
            }
            if (action === "close" && window.FusionAdBridge.close) {
              window.FusionAdBridge.close();
              return;
            }
            if (action === "impression" && window.FusionAdBridge.impression) {
              window.FusionAdBridge.impression();
              return;
            }
          }

          var query = "";
          if (params) {
            var chunks = [];
            for (var key in params) {
              if (Object.prototype.hasOwnProperty.call(params, key) && params[key]) {
                chunks.push(
                  encodeURIComponent(key) + "=" + encodeURIComponent(String(params[key]))
                );
              }
            }
            if (chunks.length) {
              query = "?" + chunks.join("&");
            }
          }
          window.location.href = "fusionad://" + action + query;
        }

        function openPrimary() {
          navigateBridge("click", {
            target: primary.clickUrl,
            packageName: primary.packageName
          });
        }

        function bindPrimaryAction(node) {
          if (!node || node.getAttribute("data-fusion-primary-bound") === "1") return;
          node.setAttribute("data-fusion-primary-bound", "1");
          node.addEventListener("click", function (event) {
            if (event) {
              event.preventDefault();
              event.stopPropagation();
            }
            openPrimary();
          });
          node.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openPrimary();
            }
          });
        }

        function openDrawer() {
          byId("drawer").classList.add("visible");
          byId("drawerBackdrop").classList.add("visible");
        }

        function closeDrawer() {
          byId("drawer").classList.remove("visible");
          byId("drawerBackdrop").classList.remove("visible");
        }

        window.addEventListener("message", function (event) {
          var data = event && event.data;
          if (!data) return;
          if (typeof data === "string") {
            try {
              data = JSON.parse(data);
            } catch (ignore) {
              return;
            }
          }
          if (!data || typeof data !== "object") return;
          if (data.type === "fusion_ad_mute_state" && typeof data.muted === "boolean") {
            setHeroMuted(data.muted, false);
          } else if (data.type === "fusion_ad_audio_capability" && typeof data.supported === "boolean") {
            setHeroAudioSupported(data.supported);
          } else if (
            data.type === "fusion_ad_audio"
            && data.action === "mute_state"
            && typeof data.muted === "boolean"
          ) {
            setHeroMuted(data.muted, false);
          } else if (
            data.type === "fusion_ad_audio"
            && data.action === "capability"
            && typeof data.supported === "boolean"
          ) {
            setHeroAudioSupported(data.supported);
          }
        });

        if (payload.locale) {
          document.documentElement.setAttribute("lang", payload.locale);
          if (/^(ar|fa|he|ur)(-|_|$)/i.test(payload.locale)) {
            document.documentElement.setAttribute("dir", "rtl");
          }
        }

        setText("adLabel", payload.adLabel, "Sponsored");
        setText("heroBadge", primary.badge, "Editor's pick");
        setText("appTitle", primary.title, "App title");
        setText("appSubtitle", primary.description, "App description");
        if (primary.socialProof) {
          setText("proofText", primary.socialProof, "Fast onboarding, polished visuals, and clear value.");
        } else {
          var proofStrip = document.querySelector(".proof-strip");
          if (proofStrip) {
            proofStrip.classList.add("hidden");
          }
        }
        setText("appRating", primary.rating ? String(primary.rating) : "4.9");
        setText("appCategory", primary.category, "Utilities");
        setText("appReviewCount", primary.reviewCount, "120K reviews");
        setText("primaryCta", primary.cta, "Install now");
        setText("secondaryCta", primary.secondaryCta, "View more");
        setText("drawerTitle", list.title, "More apps you may like");
        setText("drawerSubtitle", list.subtitle, "Handpicked recommendations");
        setText(
          "heroCategoryPill",
          primary.category,
          "Utilities"
        );
        setText(
          "heroRatingPill",
          primary.rating ? String(primary.rating) + " ★" : "4.9 ★",
          "4.9 ★"
        );

        byId("closeBtn").setAttribute("aria-label", payload.closeHint || "Close ad");
        byId("heroMedia").setAttribute("aria-label", primary.cta || "Install now");
        byId("heroClickLayer").setAttribute("aria-label", primary.cta || "Install now");
        setHeroMedia(primary);
        setCardImage("appIcon", primary.iconUrl);
        setText("appStars", buildStars(primary.rating), "★★★★★");

        if (!primary.badge) {
          byId("heroBadge").classList.add("hidden");
        }
        if (!primary.category) {
          byId("heroCategoryPill").classList.add("hidden");
        }
        if (!primary.rating) {
          byId("heroRatingPill").classList.add("hidden");
        }

        var featureList = byId("featureList");
        var features = Array.isArray(primary.features) ? primary.features : [];
        var visibleFeatureCount = 0;
        featureList.innerHTML = "";
        for (var i = 0; i < features.length; i++) {
          if (!features[i]) continue;
          var pill = document.createElement("div");
          pill.className = "feature-pill";
          pill.textContent = features[i];
          featureList.appendChild(pill);
          visibleFeatureCount++;
        }
        if (!visibleFeatureCount) {
          featureList.classList.add("hidden");
        }

        var recommendList = byId("recommendList");
        recommendList.innerHTML = "";
        var items = Array.isArray(list.items) ? list.items : [];
        for (var j = 0; j < items.length; j++) {
          var item = items[j] || {};
          var card = document.createElement("article");
          card.className = "recommend-card";

          var thumb = document.createElement("div");
          thumb.className = "recommend-thumb";
          if (item.iconUrl) {
            thumb.style.backgroundImage = "url('" + item.iconUrl.replace(/'/g, "%27") + "')";
          }
          card.appendChild(thumb);

          var meta = document.createElement("div");
          meta.className = "recommend-meta";

          var title = document.createElement("h3");
          title.className = "recommend-title";
          title.textContent = item.title || "Recommended app";
          meta.appendChild(title);

          var desc = document.createElement("p");
          desc.className = "recommend-desc";
          desc.textContent = item.description || item.socialProof || "";
          meta.appendChild(desc);

          var footer = document.createElement("div");
          footer.className = "recommend-footer";

          var metaText = document.createElement("div");
          metaText.className = "metric-row";
          metaText.innerHTML =
            '<span class="metric-chip"><span class="stars">' +
            buildStars(item.rating) +
            "</span><span>" +
            (item.rating ? String(item.rating) : "4.8") +
            "</span></span>";
          footer.appendChild(metaText);

          var button = document.createElement("button");
          button.textContent = item.cta || "Install";
          button.addEventListener("click", (function (entry) {
            return function () {
              navigateBridge("click", {
                target: entry.clickUrl,
                packageName: entry.packageName
              });
            };
          })(item));
          footer.appendChild(button);

          meta.appendChild(footer);
          card.appendChild(meta);
          recommendList.appendChild(card);
        }

        if (!items.length) {
          byId("secondaryCta").classList.add("hidden");
          document.querySelector(".actions").classList.add("single");
        }

        byId("closeBtn").addEventListener("click", function () {
          navigateBridge("close");
        });

        byId("soundBtn").addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          if (!heroHtmlEnabled || !heroAudioSupported) return;
          setHeroMuted(!heroMuted, true);
        });

        window.FusionAdOpenPrimary = openPrimary;
        bindPrimaryAction(byId("primaryCta"));
        bindPrimaryAction(byId("heroMedia"));
        bindPrimaryAction(byId("heroClickLayer"));

        byId("secondaryCta").addEventListener("click", function () {
          openDrawer();
        });

        byId("drawerClose").addEventListener("click", closeDrawer);
        byId("drawerBackdrop").addEventListener("click", closeDrawer);

        window.setTimeout(function () {
          navigateBridge("impression");
        }, 650);
      })();
    </script>
  </body>
</html>
